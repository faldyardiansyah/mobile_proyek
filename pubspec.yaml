name: appkonkos_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.4+4

environment:
  sdk: ^3.9.2

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  get: ^4.7.3
  google_fonts: ^8.0.2
  dash_chat_2: ^0.0.21
  http: ^1.2.2
  lottie: ^3.3.2
  dio: ^5.4.0
  get_storage: ^2.1.1
  flutter_dotenv: ^5.1.0
  image_picker: ^1.0.7
  share_plus: ^10.0.0
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  url_launcher: ^6.2.0
  skeletonizer: ^2.1.3
  carousel_slider: ^5.0.0
  # midtrans_sdk: ^1.0.0 
  webview_flutter: ^4.4.0
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  google_sign_in: ^6.2.1
  app_links: ^6.3.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
