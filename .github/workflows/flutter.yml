name: Flutter CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'

      - name: Cache Flutter
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔐 Create .env
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL }}" > .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> .env

      - name: 🧪 Run Tests
        run: flutter test

      - name: 🏗️ Build APK
        run: flutter build apk --release

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 🚀 Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📢 Notify Telegram (Success)
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d parse_mode=HTML \
          -d text="✅ <b>Build APK Berhasil!</b>
          📦 <b>Repo:</b> ${{ github.repository }}
          🔖 <b>Version:</b> ${{ github.ref_name }}
          🧾 <b>Commit:</b> <code>${{ github.sha }}</code>
          👤 <b>Author:</b> ${{ github.actor }}
          🚀 Siap digunakan!"

      - name: ❌ Notify Telegram (Failed)
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d parse_mode=HTML \
          -d text="❌ <b>Build Gagal!</b>
          📦 <b>Repo:</b> ${{ github.repository }}
          🧾 <b>Commit:</b> <code>${{ github.sha }}</code>
          👤 <b>Author:</b> ${{ github.actor }}
          ⚠️ Silakan cek di tab Actions GitHub"

      - name: 📤 Send APK to Telegram
        if: success()
        run: |
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument \
          -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -F document=@build/app/outputs/flutter-apk/app-release.apk \
          -F parse_mode=HTML \
          -F caption="📦 <b>APK Berhasil Dibuild!</b>
          🔖 <b>Version:</b> ${{ github.ref_name }}
          👤 <b>By:</b> ${{ github.actor }}
          🚀 Silakan download dan install"